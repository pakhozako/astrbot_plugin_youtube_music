name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python / ${{ matrix.os }} / Pydantic ${{ matrix.pydantic }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        pydantic: ["2.12.5", "2.14.3"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt "pydantic==${{ matrix.pydantic }}"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -B scripts/check_history.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/build_release.py
      - run: python -B scripts/build_release.py --check-built
      - name: Verify Release Tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python -B scripts/check_history.py --tag "$RELEASE_TAG"
          python -B scripts/build_release.py --check-built --ref "$RELEASE_TAG"

  frontend:
    name: Production Build and Browser Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: git diff --exit-code -- views/console
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  release:
    name: Verified Tag Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [python, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML==6.0.3"
      - run: python -B scripts/build_release.py
      - name: Publish Verified ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -B scripts/publish_release.py --tag "$RELEASE_TAG"
