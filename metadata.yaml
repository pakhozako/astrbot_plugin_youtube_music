name: astrbot_plugin_youtube_music
display_name: YouTube 点歌
short_desc: 搜索 YouTube 歌曲、语音点播，并提供 WebUI 管理控制台。
desc: >-
  基于 yt-dlp、Deno、FFmpeg 和 AstrBot Record 消息组件的 YouTube 点歌插件。
  面向 QQ 群聊的候选分页、版本识别、语音点播、共享 FIFO 队列、收藏与历史重播。
  提供音乐 AI Tool、响应式 WebUI、仅限机器人搜索结果的安全自动撤回，
  以及使用 AstrBot 官方身份鉴权的依赖维护。
version: 0.2.0
# Project license: MIT; see LICENSE for the full copyright and permission notice.
author: pakhozako
repo: https://github.com/pakhozako/astrbot_plugin_youtube_music
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.29.4,<5"
